[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
files = ["custom_components/sonoff_l2_ble", "scripts"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["custom_components.sonoff_l2_ble", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = ["if TYPE_CHECKING:", "class .*\\(Protocol\\):", "def .*: \\.\\.\\."]
