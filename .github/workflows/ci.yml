name: Python CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Python ${{ matrix.python }} / HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            ha: '2026.2.3'
          - python: '3.14'
            ha: '2026.10.4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test environment
        run: |
          uv venv --python '${{ matrix.python }}'
          uv pip install -r requirements-dev.txt 'homeassistant==${{ matrix.ha }}'
      - name: Ruff lint
        run: .venv/bin/ruff check .
      - name: Ruff formatting
        run: .venv/bin/ruff format --check .
      - name: Strict mypy
        run: .venv/bin/mypy
      - name: Tests and coverage
        run: .venv/bin/pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
