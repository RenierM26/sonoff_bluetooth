version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Latest stable HA and its optional integration-manifest pins move together.
    # Coordinate with HACS metadata/docs rather than upgrading them independently.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: aiousbwatcher
      - dependency-name: pyserial
      - dependency-name: serialx
      - dependency-name: aiohasupervisor
